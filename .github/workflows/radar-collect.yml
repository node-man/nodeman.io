name: Radar raw collection

# Collects the day's raw inputs for /radar (GitHub trending + API cross-check,
# Hacker News front page, news feeds) with fetch timestamps, and commits
# content/radar/raw/<KST date>.json. The daily writer reads only this file for
# numbers. Commits made with GITHUB_TOKEN do not trigger the deploy workflow.

on:
  schedule:
    - cron: "37 21 * * *" # 06:37 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: radar-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Collect
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/radar/collect.mjs

      - name: Commit
        run: |
          git config user.name "radar-collector"
          git config user.email "radar-collector@users.noreply.github.com"
          git add content/radar/raw
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "radar: raw collection $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          exit 1
